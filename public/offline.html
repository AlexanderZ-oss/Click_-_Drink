<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sin conexión – FEREST Premium</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a0a;
            color: #fff;
            font-family: Georgia, 'Times New Roman', serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 24px;
        }
        .box { max-width: 420px; }
        .logo {
            width: 96px; height: 96px;
            background: #0a0a0a;
            color: #c5a059;
            border: 1px solid rgba(197,160,89,.35);
            border-radius: 20px;
            font-size: 56px; font-weight: bold;
            line-height: 96px;
            margin: 0 auto 28px;
        }
        h1 { font-size: 26px; font-style: italic; margin-bottom: 12px; }
        p { color: #9ca3af; font-family: system-ui, sans-serif; font-size: 15px; line-height: 1.6; margin-bottom: 28px; }
        a {
            display: inline-block;
            background: #c5a059; color: #0a0a0a;
            font-family: system-ui, sans-serif;
            font-weight: 800; letter-spacing: .12em; text-transform: uppercase;
            font-size: 12px; text-decoration: none;
            padding: 14px 32px; border-radius: 12px;
        }
    </style>
</head>
<body>
    <div class="box">
        <div class="logo">F</div>
        <h1>Sin conexión</h1>
        <p>No puedes ver el catálogo ahora mismo. Revisa tu internet y vuelve a intentarlo, o escríbenos por WhatsApp y te atendemos al instante.</p>
        <a href="/">REINTENTAR</a>
    </div>
</body>
</html>
